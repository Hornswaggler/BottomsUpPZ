name: Auto Version

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running the workflow'
        required: false
        default: 'Manual test'

permissions:
  contents: write

jobs:
  bump-version:
    # Prevent infinite loop when the workflow commits the version bump
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required to count all commits accurately
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'

      - name: Bump patch version
        run: |
          # Ensure a baseline version exists if package.json lacks one
          if [ -z "$(node -p "require('./package.json').version || ''")" ]; then
            npm version 0.0.0 --no-git-tag-version
          fi
          
          # Increment the third number by exactly 1
          npm version patch --no-git-tag-version

      - name: Commit updated version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version") [skip ci]"
          git push