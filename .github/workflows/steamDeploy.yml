name: Publish to Steam Workshop

on:
  workflow_run:
    workflows: ["Auto Version"] # Must match the 'name:' in auto-version.yml
    types:
      - completed
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running the workflow'
        required: false
        default: 'Manual test'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install SteamCMD
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note '' | sudo debconf-set-selections
          sudo apt-get install -y steamcmd jq

      - name: Generate workshop.vdf
        env:
          DEPLOY_WORKING_DIRECTORY: ${{ github.workspace }}
          STEAM_WORKSHOP_CHANGE_NOTE: ${{ github.event.head_commit.message || inputs.reason || 'Automated deployment' }}
        run: npm run generateWorkshopVDF

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: ./
          retention-days: 7 # Optional: defaults to 90 days

      - name: Restore Steam Guard Session
        run: |
          mkdir -p ~/.local/share/Steam/config
          echo "${{ secrets.STEAM_CONFIG_VDF }}" | base64 --decode > ~/.local/share/Steam/config/config.vdf


      - name: Upload to Steam Workshop
        run: |
          /usr/games/steamcmd +login "${{ secrets.STEAM_USERNAME }}" +workshop_build_item "${{ github.workspace }}/workshop.vdf" +quit