name: Publish to Steam Workshop

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running the workflow'
        required: false
        default: 'Manual test'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        
      - name: Install SteamCMD
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note '' | sudo debconf-set-selections
          sudo apt-get install -y steamcmd

      - name: Restore Steam Guard Session
        run: |
          mkdir -p ~/.local/share/Steam/config
          echo "${{ secrets.STEAM_CONFIG_VDF }}" | base64 --decode > ~/.local/share/Steam/config/config.vdf

      - name: Generate Workshop VDF
        run: |
          cat << 'EOF' > workshop.vdf
          "workshopitem"
          {
            "appid"            "108600"
            "publishedfileid"  "3842158285"
            "contentfolder"    "${{ github.workspace }}/build/Contents"
            "previewfile"      "${{ github.workspace }}/build/preview.png"
            "visibility"       "0"
            "title"            "Bottoms Up! :D"
            "description"      "One more drink might be one too many. In Project Zomboid Build 42, Bottoms Up brings the booze to life with custom drunken stumbling and falls, plus nausea and vomiting when your survivor overdoes it. Pick the Heavy Drinker trait, raise a glass, and try to stay on your feet... There are zombies to worry about, after all.\n\n[h2]\n[b]Supports Single Player AND Multiplayer![/b][/h2]"
            "changenote"       "${{github.event.head_commit.message }}"
          }
          EOF

      - name: Upload to Steam Workshop
        run: |
          /usr/games/steamcmd +login "${{ secrets.STEAM_USERNAME }}" +workshop_build_item "${{ github.workspace }}/workshop.vdf" +quit